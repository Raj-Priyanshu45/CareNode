# ─────────────────────────────────────────────────────────
# application.properties  (base config — all secrets via env)
# ─────────────────────────────────────────────────────────
spring.profiles.active=${ENV:dev}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/carenode
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT — NO default secret. App will refuse to start without JWT_SECRET set.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Cloudinary — NO embedded defaults. Set all three env vars before running.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# AI service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Server
server.port=8080
spring.mvc.format.date-time=iso
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html