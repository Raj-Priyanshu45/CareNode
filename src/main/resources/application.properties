spring.profiles.active=${ENV:dev}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/carenode
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Disable Redis autoconfiguration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# JWT
jwt.secret=${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF}
jwt.expiration=86400000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:CareNode}
cloudinary.api-key=${CLOUDINARY_API_KEY:664932757766485}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:WTC8ast4S5pWYQf_95Ygkb6jwb8}

# AI Service
ai.service.url=http://localhost:8000

# Server
server.port=8080
spring.mvc.format.date-time=iso

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html