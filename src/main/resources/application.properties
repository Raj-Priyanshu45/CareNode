# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/carenode
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=mySecretKey
jwt.expiration=86400000

# Cloudflare R2 (S3 compatible)
cloudflare.r2.access-key=your-access-key
cloudflare.r2.secret-key=your-secret-key
cloudflare.r2.endpoint=https://your-account-id.r2.cloudflarestorage.com
cloudflare.r2.bucket=carenode-bucket

# AI Service
ai.service.url=http://localhost:8000

# Server
server.port=8080

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html