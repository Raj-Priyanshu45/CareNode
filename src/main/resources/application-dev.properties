spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:4306/carenode?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:carenode}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production}
jwt.expiration=86400000

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}




