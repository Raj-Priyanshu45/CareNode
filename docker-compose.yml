
services:
  db:
    image: postgres:15-alpine
    container_name: carenode-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: carenode
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: carenode-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "900", "1", "--save", "300", "10", "--appendonly", "yes"]

volumes:
  db_data:
  redis_data: